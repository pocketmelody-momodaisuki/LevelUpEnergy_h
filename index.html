<!-- index.html -->
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>受験勉強タスクタイマー</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="header-left">
        <label for="datePicker">日付選択</label>
        <input type="date" id="datePicker">
        <button id="addDateBtn">この日付のリストを作成</button>
      </div>
      <span class="header-moon" role="img" aria-label="月">🌙</span>
      <div class="header-right">
        <span class="today-label">今日: <span id="todayText"></span></span>
        <span id="syncStatus" class="sync-status" role="status" aria-live="polite">Firebaseに接続中...</span>
      </div>
    </header>
    <main class="main">
      <section class="date-list-section">
        <h2>日付一覧</h2>
        <ul id="dateList" class="date-list"></ul>
      </section>
      <section class="task-list-section">
        <div class="task-list-topbar">
          <h2 id="taskListTitle">タスク一覧</h2>
          <div class="completion-summary">
            <span id="completionRate">達成率：0%</span>
            <div
              id="completionProgress"
              class="completion-progress"
              role="progressbar"
              aria-label="達成率"
              aria-valuemin="0"
              aria-valuemax="100"
              aria-valuenow="0"
            >
              <div id="completionProgressFill" class="completion-progress-fill"></div>
            </div>
          </div>
        </div>
        <div class="planned-duration-summary task-list-header">
          <span id="plannedDurationTotal">所要時間計：0分</span>
          <span id="remainingDurationTotal"></span>
          <div class="task-list-actions">
            <button id="operationLogBtn" class="secondary operation-log-btn">操作ログ</button>
            <button id="clearTasksBtn" class="secondary">クリア</button>
            <button id="addTaskBtn">タスク追加</button>
          </div>
        </div>
        <table class="task-table" aria-label="タスク一覧（行を長押しして並べ替えできます）">
          <thead>
            <tr>
              <th class="col-check">完了</th>
              <th class="col-name">タスク名</th>
              <th class="col-planned">所要時間</th>
              <th class="col-actual">実績時間</th>
              <th class="col-action">操作</th>
            </tr>
          </thead>
          <tbody id="taskTableBody"></tbody>
        </table>
      </section>
    </main>
    <datalist id="taskMasterList"></datalist>
    <div id="overlay" class="overlay hidden">
      <div class="overlay-content">
        <div class="overlay-header">
          <div class="overlay-task-name" id="overlayTaskName"></div>
          <div class="overlay-date" id="overlayDate"></div>
        </div>
        <div id="overlayPlannedRemaining" class="overlay-planned-remaining"></div>
        <div id="wakeLockStatus" class="wake-lock-status" role="status"></div>
        <div class="overlay-timer" id="overlayTimer">00:00</div>
        <div class="overlay-buttons">
          <button id="overlayStartBtn">開始</button>
          <button id="overlayPauseBtn">一時停止</button>
          <button id="overlayFinishBtn">完了</button>
          <button id="overlayCloseBtn">閉じる</button>
        </div>
      </div>
    </div>
    <div id="moveOverlay" class="overlay hidden">
      <div class="move-content" role="dialog" aria-modal="true" aria-labelledby="moveDialogTitle">
        <div id="moveDialogTitle" class="move-title">移動先の日付を選択してください</div>
        <div class="move-date-controls">
          <label for="moveDatePicker">日付</label>
          <input type="date" id="moveDatePicker">
        </div>
        <div id="moveError" class="move-error" role="status"></div>
        <div class="move-buttons">
          <button id="moveCancelBtn" class="secondary">キャンセル</button>
          <button id="moveAcceptBtn">この日付へタスクを移動</button>
        </div>
      </div>
    </div>
    <div id="operationLogOverlay" class="overlay operation-log-overlay hidden">
      <div class="operation-log-content" role="dialog" aria-modal="true" aria-labelledby="operationLogTitle">
        <div class="operation-log-header">
          <h2 id="operationLogTitle">操作ログ</h2>
          <button id="operationLogCloseBtn" class="secondary">閉じる</button>
        </div>
        <ul id="operationLogList" class="operation-log-list"></ul>
      </div>
    </div>
    <div id="confirmOverlay" class="overlay confirm-overlay hidden">
      <div class="confirm-content" role="alertdialog" aria-modal="true" aria-labelledby="confirmMessage">
        <div id="confirmMessage" class="confirm-message"></div>
        <div class="confirm-buttons">
          <button id="confirmCancelBtn" class="secondary">いいえ</button>
          <button id="confirmAcceptBtn" class="confirm-accept-btn">はい</button>
        </div>
      </div>
    </div>
    <script type="module" src="main.js"></script>
  </div>
</body>
</html>
